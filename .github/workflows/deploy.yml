
name: Deploy Nexus

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./nexus-hub
        run: npm install

      - name: Check server JavaScript syntax
        working-directory: ./nexus-hub
        run: node --check server/index.js

      - name: Build website
        working-directory: ./nexus-hub
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          VITE_GOOGLE_CSE_ID: ${{ vars.VITE_GOOGLE_CSE_ID }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: nexus-hub/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
