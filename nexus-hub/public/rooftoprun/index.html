<!doctype html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Roof Top Run</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/z799gs/99@main/TemplateData/style.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a;font-family:'Segoe UI',Tahoma,sans-serif}
#unity-container{position:relative;width:100%;height:100%;background:#0a0a1a}
#unity-canvas{display:block;width:100%;height:100%;background:#0a0a1a;outline:none}
#custom-loading{position:fixed;inset:0;background:linear-gradient(135deg,#0a0a1a,#1a1a3e 50%,#0a1628);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .8s ease;padding:20px}
#custom-loading.fade-out{opacity:0;pointer-events:none}
.loading-icon{font-size:56px;margin-bottom:20px;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:.8}}
.loading-title{font-size:clamp(25px,5vw,36px);font-weight:900;color:#00d4ff;text-shadow:0 0 20px #00d4ff66;letter-spacing:4px;margin-bottom:8px}
.loading-subtitle{font-size:13px;color:#809bb5;margin-bottom:30px;letter-spacing:1px;text-align:center}
.progress-container{width:min(380px,90vw);margin-bottom:12px}
.progress-bar-bg{width:100%;height:20px;background:#ffffff14;border-radius:10px;overflow:hidden;border:1px solid #00d4ff33}
.progress-bar-fill{height:100%;width:0;background:linear-gradient(90deg,#06f,#00d4ff,#06f);background-size:200% 100%;border-radius:10px;transition:width .3s;animation:shimmer 1.5s linear infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.progress-text{color:#00d4ff;font-size:15px;font-weight:bold;text-align:center;margin-top:8px}
.loading-status{color:#8aa6c0;font-size:12px;margin-top:5px;text-align:center;min-height:18px;overflow-wrap:anywhere}
.fun-message{color:#aab8d0;font-size:13px;margin-top:25px;font-style:italic;opacity:.7;text-align:center;min-height:20px}
#fullscreen{position:fixed;right:14px;bottom:14px;z-index:110;border:1px solid #00d4ff88;border-radius:7px;background:#10182b;color:white;padding:9px 13px;font-weight:700;cursor:pointer}
#load-error{display:none;color:#ff9b9b;max-width:420px;text-align:center;font-size:13px;margin-top:14px;line-height:1.5}
</style>
</head>
<body class="dark">
<div id="unity-container" class="unity-desktop">
<canvas id="unity-canvas" width="795" height="575" tabindex="-1"></canvas>
<div id="custom-loading">
<div class="loading-icon">🏃</div>
<div class="loading-title">ROOF TOP RUN</div>
<div class="loading-subtitle">Preparing game assets...</div>
<div class="progress-container">
<div class="progress-bar-bg"><div class="progress-bar-fill" id="merge-progress-bar"></div></div>
<div class="progress-text" id="merge-progress-text">0%</div>
<div class="loading-status" id="merge-status">Connecting to game files...</div>
</div>
<div class="fun-message" id="fun-message">Loading textures and shaders... 🎨</div>
<div id="load-error"></div>
</div>
</div>
<button id="fullscreen" type="button">Fullscreen</button>
<script>
(function(){
const messages=["Loading textures and shaders... 🎨","Building the world around you... 🌍","Placing all the objects... 📦","Waking up the NPCs... 🧑","Polishing the graphics... ✨","Tuning the physics engine... ⚙️","Syncing game logic... 🧠","Almost there, hang tight... 🚀","Final touches in progress... 🎯","Get ready to play! 🏆"];
let messageIndex=0;
const messageEl=document.getElementById("fun-message");
const messageTimer=setInterval(()=>{messageEl.textContent=messages[messageIndex++%messages.length]},3000);
const mergeConfig={files:[{name:"game.data.br",parts:4},{name:"game.wasm.br",parts:4}],basePath:"https://cdn.jsdelivr.net/gh/z799gs/99@d3359c5/Build/"};
const mergedFiles={};
const bar=document.getElementById("merge-progress-bar");
const pctText=document.getElementById("merge-progress-text");
const status=document.getElementById("merge-status");
const loading=document.getElementById("custom-loading");
const errorBox=document.getElementById("load-error");
const canvas=document.getElementById("unity-canvas");
const container=document.getElementById("unity-container");
function setProgress(pct,label){bar.style.width=pct+"%";pctText.textContent=pct+"%";if(label)status.textContent=label}
async function mergeFile(file,completed,total){
 const parts=[];
 for(let i=0;i<file.parts;i++){
  const url=mergeConfig.basePath+file.name+".part"+i;
  const response=await fetch(url);
  if(!response.ok)throw new Error("Could not download "+file.name+" part "+i+" (HTTP "+response.status+").");
  parts.push(new Uint8Array(await response.arrayBuffer()));
  completed.count++;
  setProgress(Math.round(completed.count/total*100),file.name+" — part "+(i+1)+"/"+file.parts);
 }
 const size=parts.reduce((sum,part)=>sum+part.length,0);
 const merged=new Uint8Array(size);
 let offset=0;
 for(const part of parts){merged.set(part,offset);offset+=part.length}
 mergedFiles[file.name]=merged.buffer;
 console.log("[MERGE] "+file.name+" merged ("+(size/1024/1024).toFixed(2)+" MB)");
}
const nativeFetch=window.fetch.bind(window);
window.fetch=function(input,options){
 const url=typeof input==="string"?input:(input&&input.url)||"";
 for(const file of mergeConfig.files){
  if((url.endsWith(file.name)||url.includes("/"+file.name))&&mergedFiles[file.name]){
   return Promise.resolve(new Response(mergedFiles[file.name].slice(0),{status:200,headers:{"Content-Type":"application/octet-stream"}}));
  }
 }
 return nativeFetch(input,options);
};
const NativeXHR=window.XMLHttpRequest;
window.XMLHttpRequest=function(){
 const xhr=new NativeXHR();
 const nativeOpen=xhr.open;
 const nativeSend=xhr.send;
 xhr.open=function(method,url){this.__mergedUrl=String(url);return nativeOpen.apply(this,arguments)};
 xhr.send=function(body){
  const file=mergeConfig.files.find(item=>this.__mergedUrl&&(this.__mergedUrl.endsWith(item.name)||this.__mergedUrl.includes("/"+item.name)));
  if(file&&mergedFiles[file.name]){
   const data=mergedFiles[file.name].slice(0);
   setTimeout(()=>{
    try{
     Object.defineProperty(xhr,"status",{configurable:true,get:()=>200});
     Object.defineProperty(xhr,"statusText",{configurable:true,get:()=>"OK"});
     Object.defineProperty(xhr,"readyState",{configurable:true,get:()=>4});
     Object.defineProperty(xhr,"response",{configurable:true,get:()=>xhr.responseType==="text"?new TextDecoder().decode(data):data});
     Object.defineProperty(xhr,"responseURL",{configurable:true,get:()=>xhr.__mergedUrl});
     if(typeof xhr.onreadystatechange==="function")xhr.onreadystatechange(new Event("readystatechange"));
     if(typeof xhr.onload==="function")xhr.onload(new ProgressEvent("load"));
     xhr.dispatchEvent(new ProgressEvent("loadend"));
    }catch(error){console.error("[XHR INTERCEPT]",error);nativeSend.call(xhr,body)}
   },0);
   return;
  }
  return nativeSend.apply(this,arguments);
 };
 return xhr;
};
window.XMLHttpRequest.prototype=NativeXHR.prototype;
for(const key of ["UNSENT","OPENED","HEADERS_RECEIVED","LOADING","DONE"])window.XMLHttpRequest[key]=NativeXHR[key];
function showError(message){
 clearInterval(messageTimer);
 document.querySelector(".loading-icon").textContent="⚠️";
 status.textContent="Game failed to load";
 errorBox.style.display="block";
 errorBox.textContent=message;
 console.error("[Roof Top Run]",message);
}
async function start(){
 const total=mergeConfig.files.reduce((sum,file)=>sum+file.parts,0);
 const completed={count:0};
 for(const file of mergeConfig.files)await mergeFile(file,completed,total);
 setProgress(100,"Starting game engine...");
 const buildUrl="https://cdn.jsdelivr.net/gh/z799gs/99@main/Build";
 const config={dataUrl:buildUrl+"/game.data.br",frameworkUrl:buildUrl+"/game.js",codeUrl:buildUrl+"/game.wasm.br",streamingAssetsUrl:"",companyName:"GAME",productName:"Roof Top Run",productVersion:"1.0"};
 if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)){container.className="unity-mobile";config.devicePixelRatio=1}
 const script=document.createElement("script");
 script.src=buildUrl+"/loader.js";
 script.onload=()=>{
  if(typeof createUnityInstance!=="function"){showError("The Unity loader downloaded, but the game engine was not found.");return}
  createUnityInstance(canvas,config,p=>{const pct=Math.round(p*100);setProgress(pct,"Loading game engine... "+pct+"%")})
   .then(instance=>{window.unityInstance=instance;clearInterval(messageTimer);loading.classList.add("fade-out");setTimeout(()=>loading.style.display="none",850)})
   .catch(err=>showError(typeof err==="string"?err:(err.message||"Unity could not start.")));
 };
 script.onerror=()=>showError("The Unity loader could not be downloaded. Please try again later.");
 document.body.appendChild(script);
}
start().catch(err=>showError(err.message||String(err)));
document.getElementById("fullscreen").addEventListener("click",()=>{const target=document.getElementById("unity-container");if(target.requestFullscreen)target.requestFullscreen();else if(target.webkitRequestFullscreen)target.webkitRequestFullscreen()});
})();
</script>
</body>
</html>
