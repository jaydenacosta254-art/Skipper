<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roof Top Run</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b12;color:#fff;font-family:Arial,sans-serif}
#game{display:block;width:100%;height:100%;border:0;background:#090b12}
#status{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:#090b12;z-index:2}
#status.hidden{display:none}.panel{max-width:420px}.panel h1{margin:0 0 10px;font-size:26px}.panel p{color:#c4c8d4;line-height:1.5}.loader{width:34px;height:34px;border:3px solid #34394a;border-top-color:#9b75ff;border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}@keyframes spin{to{transform:rotate(360deg)}}
#fullscreen{position:fixed;right:14px;bottom:14px;z-index:3;border:1px solid #8c68f5;border-radius:8px;background:#171323;color:white;padding:10px 14px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<iframe id="game" title="Roof Top Run" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
<div id="status"><div class="panel"><div class="loader"></div><h1>Loading Roof Top Run…</h1><p id="message">Getting the game ready. This may take a moment.</p></div></div>
<button id="fullscreen" type="button">Fullscreen</button>
<script>
const GAME_FILE="https://cdn.jsdelivr.net/gh/z799gs/99@main/3.xml";
const frame=document.getElementById("game"),status=document.getElementById("status"),message=document.getElementById("message");
fetch(GAME_FILE).then(response=>{if(!response.ok)throw new Error("The game file could not be found ("+response.status+").");return response.text()}).then(html=>{frame.srcdoc=html;status.classList.add("hidden")}).catch(error=>{document.querySelector(".loader").style.display="none";document.querySelector("#status h1").textContent="Could not load Roof Top Run";message.textContent=error.message+" Please try again later or open the game in a new tab."});
document.getElementById("fullscreen").addEventListener("click",()=>{if(frame.requestFullscreen)frame.requestFullscreen();else if(frame.webkitRequestFullscreen)frame.webkitRequestFullscreen()});
</script>
</body>
</html>
